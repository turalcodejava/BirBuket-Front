<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/birbuket-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <title>BirBuket - Premium Çiçək Xidməti</title>
    <style>
      iframe.goog-te-banner-frame,
      iframe[class*="goog-te-banner-frame"],
      iframe[id*="goog-te-banner-frame"],
      iframe[src*="translate.google.com"],
      iframe[src*="translate.googleapis.com"],
      iframe[class*="goog"],
      iframe[id*="goog"],
      .goog-te-banner-frame,
      .goog-te-banner,
      .goog-te-gadget-icon,
      #goog-gt-tt,
      .goog-tooltip,
      .goog-tooltip:hover,
      .skiptranslate[id*="goog"],
      iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'az',
          includedLanguages: 'az,ru,en,uz',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
